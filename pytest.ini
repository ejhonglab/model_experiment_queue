[pytest]
# the queue's tests (run with QUICK=1; CLAUDE.md, "Code changes"); the monitor's own tests are in
# coordination/monitor/ and run with `pytest coordination/monitor` (standard library only, besides pytest)
testpaths = test
addopts = -p no:cacheprovider
# pytest's tmp_path dirs are removed after each run (as in al_analysis; some tests write model
# outputs there)
tmp_path_retention_policy = none
